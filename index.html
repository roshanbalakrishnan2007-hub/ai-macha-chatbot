<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Website — Chatbot Demo</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0; padding: 60px 24px; min-height: 100vh; color: #fff9f0;
      background: linear-gradient(135deg, #1E0B4B 0%, #6D1B8F 38%, #E0407A 68%, #F5A524 100%);
      background-attachment: fixed;
    }
    .wrap { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 26px; margin-bottom: 8px; }
    p { color: rgba(255,249,240,0.85); line-height: 1.6; }
    code { background: rgba(255,255,255,0.18); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>This is your website</h1>
    <p>
      The chat bubble in the bottom-right corner is your assistant widget.
      It's added with a single script tag — copy that same tag onto any page
      of your real site to add the chatbot there too.
    </p>
    <p>
      Try it now: click the bubble and ask it something.
    </p>
  </div>

  <!-- This is the only line you need to add to any page on your site -->
  <script src="/widget.js" data-api-url="/api/chat" data-name="Assistant" data-greeting="Hi! What can I help you with?"></script>
</body>
</html>
